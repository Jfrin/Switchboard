name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: cp .env.example .env
      - name: Build image
        run: docker compose build api
      - name: Lint
        run: docker compose run --rm --no-deps api ruff check app tests eval migrations scripts
      - name: Test
        run: docker compose run --rm --no-deps api pytest -q
